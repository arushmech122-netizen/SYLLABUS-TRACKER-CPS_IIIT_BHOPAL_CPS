<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Tracker & Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for topic lists to keep cards neat */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        
        /* Smooth progress bar transitions */
        .progress-bar-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation & Overall Progress -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                    </svg>
                    <h1 class="text-xl font-bold text-slate-800 tracking-tight">SyllabusTracker</h1>
                </div>

                <!-- Overall Progress Bar -->
                <div class="w-full md:w-1/2 flex flex-col items-center">
                    <div class="flex justify-between w-full text-xs font-semibold text-slate-500 mb-1 px-1">
                        <span>Overall Completion</span>
                        <span id="overall-percentage">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="overall-progress-bar" class="bg-indigo-600 h-full rounded-full progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>

                <button onclick="openModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-5 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    Add Subject
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content: Subject Grid -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <div id="subject-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </main>

    <!-- Add Subject Modal -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex-col items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-lg font-bold text-slate-800">Add New Subject</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-6">
                <form id="add-subject-form">
                    <!-- Subject Name -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Subject Name</label>
                        <input type="text" id="subject-name" required placeholder="e.g., Data Structures" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow">
                    </div>

                    <!-- Default Subject Priority (Applied to added topics) -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Default Priority for Topics</label>
                        <div class="flex gap-4">
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" name="priority" value="red" checked class="w-4 h-4 text-red-600 border-gray-300 focus:ring-red-500">
                                <span class="ml-2 text-sm text-slate-700">Primary (Red)</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="radio" name="priority" value="green" class="w-4 h-4 text-emerald-500 border-gray-300 focus:ring-emerald-500">
                                <span class="ml-2 text-sm text-slate-700">Secondary (Green)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Topics -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Syllabus Chunks / Topics</label>
                        <div id="topics-container" class="space-y-2">
                            <!-- Initial Topic Input -->
                            <div class="flex gap-2 topic-row">
                                <input type="text" required placeholder="Chunk 1" class="topic-input flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow text-sm">
                                <button type="button" onclick="removeTopicRow(this)" class="px-3 py-2 text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 rounded-lg transition-colors border border-slate-200" title="Remove Topic">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="button" onclick="addTopicRow()" class="mt-3 text-sm text-indigo-600 font-medium hover:text-indigo-800 flex items-center gap-1 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                            Add another chunk
                        </button>
                    </div>

                    <!-- Actions -->
                    <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-5 py-2 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium transition-colors">Cancel</button>
                        <button type="submit" class="px-5 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium shadow-sm transition-colors">Save Subject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Initial State & Local Storage Setup ---
        
        // Pre-loaded syllabus data per requirements
        const defaultData = [
            {
                id: 'sub-foee',
                title: 'FOEE',
                topics: [
                    { id: 'foee-1', title: 'Chunk 1: D.C. Circuits — KVL, KCL, Loop/Nodal equations, Network Theorems, and Star Delta.', priority: 'red', completed: false },
                    { id: 'foee-2', title: 'Chunk 2: A.C. Circuits — RMS/Average values, Power factor, Series/Parallel AC, and Resonance.', priority: 'red', completed: false },
                    { id: 'foee-3', title: 'Chunk 3: Transformers — Phasor diagrams, Equivalent circuits, Losses, Tests, and Efficiency.', priority: 'red', completed: false },
                    { id: 'foee-4', title: 'Chunk 4: Semiconductor Devices — PN/Zener diodes, Rectifiers, and BJT configurations (CB, CE, CC).', priority: 'red', completed: false },
                    { id: 'foee-5', title: 'Chunk 5: Digital Logic — Number systems, Boolean algebra, Logic Gates, and Combinational circuits.', priority: 'green', completed: false }
                ]
            },
            {
                id: 'sub-emi',
                title: 'EM-I',
                topics: [
                    { id: 'emi-1', title: 'Chunk 1: Multivariable Calculus — Partial derivatives, Lagrange multipliers, and Maxima/Minima.', priority: 'red', completed: false },
                    { id: 'emi-2', title: 'Chunk 2: Integral Calculus — Multiple integrals, Beta & Gamma functions, and Area/Volume.', priority: 'red', completed: false },
                    { id: 'emi-3', title: 'Chunk 3: Higher Order ODEs — Constant/variable coefficients and Method of Parameter Variation.', priority: 'red', completed: false },
                    { id: 'emi-4', title: 'Chunk 4: Single Variable Calculus — Taylor/Maclaurin series, Error estimates, and Convergence tests.', priority: 'green', completed: false },
                    { id: 'emi-5', title: 'Chunk 5: First Order ODEs — Concept of Order/Degree, Formation, and Solution.', priority: 'green', completed: false }
                ]
            },
            {
                id: 'sub-ephy',
                title: 'EPhy',
                topics: [
                    { id: 'ephy-1', title: 'Chunk 1: Quantum Physics — Schrödinger\'s equation, Particle in a box, and Quantum tunneling.', priority: 'red', completed: false },
                    { id: 'ephy-2', title: 'Chunk 2: Wave Optics — Interference in thin films, Newton\'s rings, and Fraunhofer\'s Diffraction.', priority: 'red', completed: false },
                    { id: 'ephy-3', title: 'Chunk 3: Relativity — Lorentz transformation, Time dilation, Length contraction, and Mass-Energy.', priority: 'red', completed: false },
                    { id: 'ephy-4', title: 'Chunk 4: Solid State — Fermi level, Transistors, Superconductors, and Meissner effect.', priority: 'green', completed: false },
                    { id: 'ephy-5', title: 'Chunk 5: Lasers & Fibers — Einstein\'s coefficients, Ruby/He-Ne lasers, Numerical aperture, and Attenuation.', priority: 'green', completed: false },
                    { id: 'ephy-6', title: 'Chunk 6: Nuclear Physics — Binding energy, Fission/Fusion, GM counter, and Particle accelerators.', priority: 'green', completed: false }
                ]
            },
            {
                id: 'sub-focp',
                title: 'FOCP',
                topics: [
                    { id: 'focp-1', title: 'Chunk 1: Fundamentals — Bit patterns, Compilers, Flowcharts, Data types, and Control loops.', priority: 'green', completed: false },
                    { id: 'focp-2', title: 'Chunk 2: Modular & Recursion — Functions, Scope, Stack usage, and Recursion vs Iteration.', priority: 'red', completed: false },
                    { id: 'focp-3', title: 'Chunk 3: Arrays — 1D/2D arrays, Matrices, Traversals, and String manipulations.', priority: 'red', completed: false },
                    { id: 'focp-4', title: 'Chunk 4: Pointers & Memory — DMA, Structures, Unions, and Accessing via pointers.', priority: 'red', completed: false },
                    { id: 'focp-5', title: 'Chunk 5: File Handling — File pointers, Redirection, Preprocessor, and Library functions.', priority: 'green', completed: false }
                ]
            },
            {
                id: 'sub-pcomm',
                title: 'P-COMM',
                topics: [
                    { id: 'pcomm-1', title: 'Chunk 1: Comm & Interpersonal Skills — 7C\'s, Barriers, Time management, and Effective emails.', priority: 'green', completed: false },
                    { id: 'pcomm-2', title: 'Chunk 2: Written Communication — Business letters, Summary writing, Resumes, and Cover letters.', priority: 'green', completed: false },
                    { id: 'pcomm-3', title: 'Chunk 3: Speaking & GD — Pronunciation, Paralanguage, GD strategies, and Interview etiquette.', priority: 'green', completed: false }
                ]
            }
        ];

        // Load from local storage or fallback to default (Updated key to V2 to bust old cache)
        let subjectsData = JSON.parse(localStorage.getItem('syllabusTrackerDataV2')) || defaultData;

        // Helper to persist data
        const saveToLocalStorage = () => {
            localStorage.setItem('syllabusTrackerDataV2', JSON.stringify(subjectsData));
        };

        // --- 2. Rendering Logic ---

        const gridContainer = document.getElementById('subject-grid');

        // Initial render
        function initApp() {
            renderAllCards();
            updateProgressUI();
            setupEventListeners();
        }

        function renderAllCards() {
            gridContainer.innerHTML = ''; 
            
            if (subjectsData.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center p-12 text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <p class="text-lg">No subjects added yet.</p>
                        <p class="text-sm">Click 'Add Subject' to start tracking.</p>
                    </div>`;
                return;
            }

            subjectsData.forEach(subject => {
                const cardHTML = generateCardHTML(subject);
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function generateCardHTML(subject) {
            const { completed, total, percentage } = calculateSubjectStats(subject);

            // Generate Topics HTML
            let topicsHTML = '';
            subject.topics.forEach(topic => {
                const isChecked = topic.completed ? 'checked' : '';
                
                // Color themes based on priority (Red = Primary, Green = Secondary)
                const isRed = topic.priority === 'red';
                const containerStyle = isRed 
                    ? 'border-red-400 bg-red-50/60 hover:bg-red-50/90' 
                    : 'border-emerald-400 bg-emerald-50/60 hover:bg-emerald-50/90';
                
                const badge = isRed
                    ? `<span class="mt-1.5 shrink-0 inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-red-100 text-red-700 border border-red-200 uppercase tracking-wider">Primary</span>`
                    : `<span class="mt-1.5 shrink-0 inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 uppercase tracking-wider">Secondary</span>`;
                
                const checkboxStyle = isRed ? 'text-red-500 focus:ring-red-500' : 'text-emerald-500 focus:ring-emerald-500';
                const textStyle = topic.completed ? 'line-through text-slate-400 opacity-60' : 'text-slate-800';

                topicsHTML += `
                    <li class="flex items-start gap-3 p-3 rounded-xl border-l-[5px] ${containerStyle} mb-3 shadow-sm transition-all duration-200">
                        <div class="flex items-center h-5 mt-1">
                            <input 
                                type="checkbox" 
                                data-subject-id="${subject.id}" 
                                data-topic-id="${topic.id}"
                                ${isChecked}
                                class="w-4 h-4 rounded cursor-pointer transition-colors ${checkboxStyle} bg-white border-slate-300"
                            >
                        </div>
                        <div class="flex flex-col flex-grow cursor-pointer" onclick="this.previousElementSibling.firstElementChild.click()">
                            <label class="text-sm font-medium transition-all duration-200 cursor-pointer ${textStyle} leading-relaxed">
                                ${topic.title}
                            </label>
                            <div>${badge}</div>
                        </div>
                    </li>
                `;
            });

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[520px] hover:shadow-md transition-shadow relative">
                    <!-- Top Blue Accent -->
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-indigo-600"></div>
                    
                    <!-- Card Header -->
                    <div class="px-5 pt-6 pb-4 border-b border-slate-100 bg-slate-50/80">
                        <h3 class="text-xl font-bold text-slate-800 leading-snug truncate" title="${subject.title}">${subject.title}</h3>
                        
                        <!-- Local Progress -->
                        <div class="mt-3">
                            <div class="flex justify-between text-xs font-bold text-slate-500 mb-1.5">
                                <span class="uppercase tracking-wider">Progress</span>
                                <span id="text-prog-${subject.id}">${completed}/${total} (${percentage}%)</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2.5 shadow-inner">
                                <div id="bar-prog-${subject.id}" class="bg-indigo-600 h-2.5 rounded-full progress-bar-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Topics Checklist -->
                    <div class="p-4 flex-grow overflow-y-auto custom-scrollbar bg-white">
                        <ul class="space-y-1">
                            ${topicsHTML}
                        </ul>
                    </div>
                </div>
            `;
        }

        // --- 3. Logic & Calculations ---

        function calculateSubjectStats(subject) {
            const total = subject.topics.length;
            if (total === 0) return { completed: 0, total: 0, percentage: 0 };
            
            const completed = subject.topics.filter(t => t.completed).length;
            const percentage = Math.round((completed / total) * 100);
            return { completed, total, percentage };
        }

        function updateProgressUI() {
            let totalTopics = 0;
            let totalCompleted = 0;

            // 1. Update individual subject progress bars
            subjectsData.forEach(subject => {
                const stats = calculateSubjectStats(subject);
                totalTopics += stats.total;
                totalCompleted += stats.completed;

                const textElem = document.getElementById(`text-prog-${subject.id}`);
                const barElem = document.getElementById(`bar-prog-${subject.id}`);
                
                if (textElem && barElem) {
                    textElem.textContent = `${stats.completed}/${stats.total} (${stats.percentage}%)`;
                    barElem.style.width = `${stats.percentage}%`;
                }
            });

            // 2. Update Overall Progress Bar
            const overallPercentage = totalTopics === 0 ? 0 : Math.round((totalCompleted / totalTopics) * 100);
            
            document.getElementById('overall-percentage').textContent = `${overallPercentage}%`;
            document.getElementById('overall-progress-bar').style.width = `${overallPercentage}%`;
        }

        // --- 4. Event Handling ---

        function setupEventListeners() {
            // Event delegation for checkboxes
            gridContainer.addEventListener('change', function(e) {
                if (e.target.tagName.toLowerCase() === 'input' && e.target.type === 'checkbox') {
                    const subjectId = e.target.getAttribute('data-subject-id');
                    const topicId = e.target.getAttribute('data-topic-id');
                    const isChecked = e.target.checked;

                    // Update Data State
                    const subject = subjectsData.find(s => s.id === subjectId);
                    if (subject) {
                        const topic = subject.topics.find(t => t.id === topicId);
                        if (topic) {
                            topic.completed = isChecked;
                        }
                    }

                    // Save to local storage immediately
                    saveToLocalStorage();

                    // Update specific label style visually without full re-render
                    const label = e.target.closest('li').querySelector('label');
                    if (isChecked) {
                        label.classList.add('line-through', 'text-slate-400', 'opacity-60');
                        label.classList.remove('text-slate-800');
                    } else {
                        label.classList.remove('line-through', 'text-slate-400', 'opacity-60');
                        label.classList.add('text-slate-800');
                    }

                    // Recalculate and animate progress bars
                    updateProgressUI();
                }
            });

            document.getElementById('add-subject-form').addEventListener('submit', handleFormSubmit);
        }

        // --- 5. Modal & Form Logic ---

        const modal = document.getElementById('add-modal');
        const modalContent = document.getElementById('modal-content');
        const topicsContainer = document.getElementById('topics-container');

        function openModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            });
            document.getElementById('subject-name').focus();
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                resetForm();
            }, 300);
        }

        function addTopicRow() {
            const rowCount = topicsContainer.querySelectorAll('.topic-row').length + 1;
            const newRow = document.createElement('div');
            newRow.className = 'flex gap-2 topic-row mt-2';
            newRow.innerHTML = `
                <input type="text" required placeholder="Chunk ${rowCount}" class="topic-input flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow text-sm">
                <button type="button" onclick="removeTopicRow(this)" class="px-3 py-2 text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 rounded-lg transition-colors border border-slate-200" title="Remove Topic">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            `;
            topicsContainer.appendChild(newRow);
            newRow.querySelector('input').focus();
        }

        function removeTopicRow(button) {
            const rows = topicsContainer.querySelectorAll('.topic-row');
            if (rows.length > 1) {
                button.closest('.topic-row').remove();
                const remainingInputs = topicsContainer.querySelectorAll('.topic-input');
                remainingInputs.forEach((input, index) => {
                    input.placeholder = `Chunk ${index + 1}`;
                });
            } else {
                const row = button.closest('.topic-row');
                row.classList.add('translate-x-1');
                setTimeout(() => row.classList.remove('translate-x-1'), 100);
            }
        }

        function resetForm() {
            document.getElementById('add-subject-form').reset();
            topicsContainer.innerHTML = `
                <div class="flex gap-2 topic-row">
                    <input type="text" required placeholder="Chunk 1" class="topic-input flex-grow px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow text-sm">
                    <button type="button" onclick="removeTopicRow(this)" class="px-3 py-2 text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 rounded-lg transition-colors border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            `;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('subject-name').value.trim();
            const priority = document.querySelector('input[name="priority"]:checked').value;
            const topicInputs = document.querySelectorAll('.topic-input');
            
            const topics = [];
            topicInputs.forEach((input, index) => {
                const topicTitle = input.value.trim();
                if (topicTitle) {
                    topics.push({
                        id: 't-new-' + Date.now() + '-' + index,
                        title: topicTitle,
                        priority: priority, 
                        completed: false
                    });
                }
            });

            if (title && topics.length > 0) {
                const newSubject = {
                    id: 'sub-new-' + Date.now(),
                    title: title,
                    topics: topics
                };

                subjectsData.push(newSubject);
                saveToLocalStorage(); // Save new subject
                
                closeModal();
                renderAllCards();
                updateProgressUI(); 
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
